<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./stiyles.css">
  <title>Frontend Mentor | Product preview card component</title>


</head>
<body>

    <div id="card">
      <div id="imagen">
        <img src="./images/image-product-desktop.jpg" alt="">
      </div>

      <div id="contenido">
        <p id="producto">Perfume</p>
        <h1 id="titulo">Gabrielle Essence Eau De Parfum</h1>
        <p id="descripcion">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
          Perfumer-Creator for the House of CHANEL.</p>
      <div id="precio">
        <p id="pricenew">$149.99</p>
        <p id="priceold"><del>$169.99</del></p>
      </div>
      <button>
          <img id="carrito" src="./images/icon-cart.svg" alt="">
    

        <p>Add to Cart</p>
        

      </button>
        



      </div>
        

</div>
  

</body>
</html>
